<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Form</title>
  </head>
  <body>
    <fieldset>
       
      <legend align="center">Basic Form</legend>
      <form>
        <label for="fullName">Full Name :</label>
        <input
          type="text"
          name="fullName"
          id="fullName"
          placeholder="Enter your name"
        />
        <br /><br />
        <label for="email">E-mail :</label>
        <input type="text" name="email" id="email" placeholder="Your E-mail" />
        <br /><br />
        <label for="password">Password :</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter Password"
        />
        <br /><br />
        <label for="cfpassword">Confirm Password :</label>
        <input
          type="cfpassword"
          name="ConfirmPassword"
          id="cfpassword"
          placeholder="Write password Again"
        />
        <br /><br />
        <label for="dob">DOB :</label>
        <input type="date" name="dob" id="dob" />
        <br /><br />
        <label for="joiningTime">joiningTime</label>
        <input type="datetime-local" name="joiningTime" id="joiningTime" />
        <br /><br />
        <label for="volume">volume</label>
        <input
          type="range"
          name="volume"
          id="volume"
          min="0"
          max="100"
          value="20"
        />
        <br /><br />
        <label for="mobile">Phone No. :</label>
        <input
          type="mobile"
          name="mobile"
          id="mobile"
          placeholder="+91 .........."
        />
        <br /><br />
        <label for="resume">Choose File</label>
        <input type="file" name="resume" id="resume" />
        <br /><br />
        <label for="address">Address :</label>
        <textarea name="address" id="address"></textarea>
        <br /><br />
        <label for="course">Course</label>
        <select name="course" id="course">
          <option value="">--Select Course--</option>
          <option value="btech">B.Tech</option>
          <option value="bba">BBA</option>
          <option value="bpharma">B.Pharma</option>
          <option value="mba">MBA</option>
        </select>
        <br /><br />
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male" /> <span>Male</span>
        <input type="radio" name="gender" id="female" /> <span>Female</span>
        <input type="radio" name="gender" id="others" /> <span>Others</span>
        <br /><br />
        <label for="skillSet">Skill Set</label>
        <input type="checkbox" name="skillSet" id="java" /> <span>Java</span>
        <input type="checkbox" name="skillSet" id="dsa" /> <span>DSA</span>
        <input type="checkbox" name="skillSet" id="html" /> <span>HTML</span>
        <input type="checkbox" name="skillSet" id="mern" />
        <span>Mern Stack</span>
        <input type="checkbox" name="skillSet" id="springboot" />
        <span>Spring Boot</span> <br /><br />
        <img
          src="https://images.stockcake.com/public/1/3/2/132b6ada-51f5-45db-9676-5791a258e0f1/late-night-studying-stockcake.jpg"
          alt=""
          width="200"
          height="200"
        />
        <br /><br />
        <button>Submit</button>
      </form>
    </fieldset>
  </body>
</html>
