<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<h1>TASK 4</h1>
<body>
    <table width="1200" border="1" cellspacing="5" cellpadding="10" align="center">
        <tr>
            <td colspan="4" align="center">
                <h2>Registration Form</h2>
            </td>
        </tr>

        <tr>
            <td>Student Name</td>
            <td><input type="text" size="25" value="First Name"></td>
            <td><input type="text" size="25" value="Middle Name"></td>
            <td><input type="text" size="25" value="Last Name"></td>
        </tr>

        <tr>
            <td>Father's Name</td>
            <td colspan="1"><input type="text" size="30" value="Enter your father's Name"></td>
            <td>Mother's Name</td>
            <td><input type="text" size="30" value="Enter your Mother's Name"></td>
        </tr>

        <tr>
            <td>Date of Birth</td>
            <td><input type="text" size="30" value="mm / dd / yyyy"></td>
            <td>Gender</td>
            <td>Male <input type="radio" name="gender"> Female <input type="radio" name="gender"></td>
        </tr>

        <tr>
            <td>Category</td>
            <td>Gen <input type="radio" name="category"> OBC <input type="radio" name="category"> SC/ST <input type="radio" name="category"></td>
            <td>Handicapped</td>
            <td>Yes <input type="radio" name="handicapped"> No <input type="radio" name="handicapped"></td>
        </tr>

        <tr>
            <td>Ex-Serviceman</td>
            <td>Yes <input type="radio" name="serviceman"> No <input type="radio" name="serviceman"></td>
            <td>EWS</td>
            <td>Yes <input type="radio" name="ews"> No <input type="radio" name="ews"></td>
        </tr>

        <tr>
            <td>Email ID</td>
            <td><input type="email" size="30"></td>
            <td>Mobile No.</td>
            <td><input type="text" size="30"></td>
        </tr>

        <tr>
            <td>State</td>
            <td>
                <select>
                    <option>Select any One</option>
                </select>
            </td>
            <td>City</td>
            <td>
                <select>
                    <option>Select any One</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Upload Photo</td>
            <td><input type="file"> No file selected.</td>
            <td>Upload Signature</td>
            <td><input type="file"> No file selected.</td>
        </tr>

        <tr>
            <td colspan="4" align="center">
                <input type="submit" value="Submit">
            </td>
        </tr>
    </table>
    <br><br>
    <div align="center">
        <a href="../Form_index.html"><button>Go Form Assignment Page</button></a>
    <br><br>
    <a href="../../revision_index.html"><button>Go Home</button></a>
    </div>
</body>
</html>
