    <h1>TASK3</h1>

    <h2>Factoring Formulas</h2>
    
    <hr />
    <ol type="1">
      <li>(x+y)<sup>2</sup> = x<sup>2</sup>+y<sup>2</sup>+2xy</li>
      <li>(a-b)<sup>2</sup> = a<sup>2</sup>-2ab+b<sup>2</sup></li>
      <li>a<sup>2</sup>+b<sup>2</sup> = (a+b)<sup>2</sup>-2ab</li>
      <li>
        (a+b+c)<sup>2</sup> =
        a<sup>2</sup>+b<sup>2</sup>+c<sup>2</sup>+2ab+2bc+2ca
      </li>
      <li>
        (a+b)<sup>3</sup> =
        a<sup>3</sup>+b<sup>3</sup>+3ab<sup>2</sup>+3a<sup>2</sup>b
      </li>
      <li>2H<sub>2</sub> + O<sub>2</sub> --> 2H<sub>2</sub>O</li>
      <li>S<sub>8</sub> + 12O<sub>2</sub> --> 8SO<sub>3</sub></li>
      <li>2NA + 2H<sub>2</sub>O --> 2NaOH + H<sub>2</sub></li>
    </ol>
