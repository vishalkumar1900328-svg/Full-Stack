<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Assignment Rows, columns, header and data</title>
</head>
<body>

    <h3>Table 1. </h3>
    <b>Containing one row only</b>
    <br>
    <b>-------------------------------</b>
    <br><br>

    <table border="1" cellspadding="10">
        <tr>
            <td>(1,1)</td>
            <td>(1,2)</td>
            <td>(1,3)</td>
        </tr>
    </table>

    <br><hr><br>

    <h3>Table 2:</h3>
    <strong>Demonstarte the difference between th and td :</strong>
    <br>
    <b>--------------------------------------------------------------</b>
    <br><br>

    <table border="1" cellpadding="10">
        <tr>
            <th>Heading 1</th>
            <th>Heading 2</th>
            <th>Heading 3</th>
        </tr>

        <tr>
            <td>Data 1</td>
            <td>Data 2</td>
            <td>Data 3</td>
        </tr>

        <tr>
            <td>Data 4</td>
            <td>Data 5</td>
            <td>Data 6</td>
        </tr>
    </table>
</body>
</html>
